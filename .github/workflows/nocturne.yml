# Lancement de chaque nuit : brique 1 (questions écrites), brique 2 (échéanciers), brique 3 (Journal officiel),
# puis publication.
# La publication ne se fait que si tous les contrôles passent (scripts/publier.py). Sinon l'exécution
# échoue, rien n'est publié, et GitHub prévient par e-mail (réglage par défaut des notifications Actions).
# Les sorties brutes sont aussi conservées 90 jours comme pièce jointe de l'exécution (onglet Actions).

name: Lancement nocturne

on:
  schedule:
    # Les horaires GitHub sont en temps universel (UTC) : 1 h UTC = 3 h à Paris en été, 2 h en hiver.
    # GitHub peut décaler le départ de quelques minutes à une heure les jours chargés.
    - cron: "0 1 * * *"
  workflow_dispatch:   # bouton « Run workflow » pour lancer à la main

permissions:
  contents: read

# Une seule exécution à la fois : une publication ne peut pas en croiser une autre.
concurrency:
  group: nocturne
  cancel-in-progress: false

env:
  ADRESSE_SITE: https://myqoh.github.io/veille-animale

jobs:
  briques:
    runs-on: ubuntu-24.04   # version fixée : ubuntu-latest changera de version le 19/10/2026
    timeout-minutes: 330   # la toute première lecture du Journal officiel est longue ; ensuite quelques minutes
    permissions:
      contents: write   # pour créer une version datée dans les Releases
    outputs:
      nouvelle_version: ${{ steps.publier.outputs.nouvelle_version }}
      version: ${{ steps.publier.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip

      - name: Installer les bibliothèques (versions fixées)
        run: pip install -r requirements.txt

      # Archives figées de l'Assemblée (14e, 15e, 16e) : téléchargées une seule fois, puis reprises du cache.
      # Le script vérifie de toute façon leur empreinte MD5 officielle à chaque lancement.
      - name: Reprendre les archives figées de l'Assemblée du cache
        id: cache_an
        uses: actions/cache/restore@v6
        with:
          path: |
            donnees_brutes/an/questions_ecrites_14.json.zip
            donnees_brutes/an/questions_ecrites_15.json.zip
            donnees_brutes/an/questions_ecrites_16.json.zip
          key: an-archives-figees-v1

      # Archive DOLE : on repère son nom sur le serveur de la DILA ; tant qu'il ne change pas, on reprend le cache.
      # Si la DILA publie une nouvelle archive, son nom change et elle est téléchargée une fois.
      - name: Nom de l'archive DOLE en ligne
        id: dole
        run: |
          nom=$(curl -s --retry 5 https://echanges.dila.gouv.fr/OPENDATA/DOLE/ | grep -oE 'Freemium_dole_global_[^"]*\.tar\.gz' | sort -u | tail -n 1)
          echo "Archive DOLE : ${nom:-introuvable}"
          echo "nom=${nom:-introuvable}" >> "$GITHUB_OUTPUT"

      - name: Reprendre l'archive DOLE du cache
        id: cache_dole
        uses: actions/cache/restore@v6
        with:
          path: donnees_brutes/dole
          key: dole-${{ steps.dole.outputs.nom }}

      # Le serveur de l'Assemblée coupe parfois les connexions : jusqu'à 5 tentatives.
      # Chaque tentative reprend le téléchargement là où il s'était arrêté.
      - name: Brique 1, questions écrites
        run: |
          for i in 1 2 3 4 5; do
            echo "::group::Tentative $i"
            if python scripts/brique1_questions_ecrites.py; then echo "::endgroup::"; exit 0; fi
            echo "::endgroup::"
            echo "Échec de la tentative $i, nouvel essai dans 2 minutes"
            sleep 120
          done
          exit 1

      # Sauvegarde juste après la brique 1, même si la suite échoue.
      - name: Mettre en cache les archives figées de l'Assemblée
        if: steps.cache_an.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: |
            donnees_brutes/an/questions_ecrites_14.json.zip
            donnees_brutes/an/questions_ecrites_15.json.zip
            donnees_brutes/an/questions_ecrites_16.json.zip
          key: an-archives-figees-v1

      - name: Brique 2, échéanciers d'application
        run: |
          for i in 1 2 3; do
            if python scripts/brique2_echeanciers.py; then exit 0; fi
            echo "Échec de la tentative $i, nouvel essai dans 2 minutes"
            sleep 120
          done
          exit 1

      - name: Mettre en cache l'archive DOLE
        if: steps.cache_dole.outputs.cache-hit != 'true' && steps.dole.outputs.nom != 'introuvable'
        uses: actions/cache/save@v6
        with:
          path: donnees_brutes/dole
          key: dole-${{ steps.dole.outputs.nom }}

      # Journal officiel : chaque archive n'est analysée qu'une fois ; les résultats (petits fichiers) sont gardés
      # en cache d'une nuit à l'autre. La première exécution lit tout l'historique (archive de 1,6 Go) : elle est longue.
      - name: Reprendre les analyses du Journal officiel
        uses: actions/cache/restore@v6
        with:
          path: donnees_brutes/jorf/extraits
          key: jorf-extraits-${{ github.run_id }}
          restore-keys: jorf-extraits-

      - name: Brique 3, Journal officiel
        run: |
          for i in 1 2 3; do
            if python scripts/brique3_journal_officiel.py; then exit 0; fi
            echo "Échec de la tentative $i, nouvel essai dans 2 minutes"
            sleep 120
          done
          exit 1

      - name: Garder les analyses du Journal officiel
        uses: actions/cache/save@v6
        with:
          path: donnees_brutes/jorf/extraits
          key: jorf-extraits-${{ github.run_id }}

      # Contrôles, vocabulaire neutre, mise en forme. En cas d'échec d'un contrôle, l'exécution s'arrête ici.
      - name: Préparer la publication (avec contrôles)
        id: publier
        run: |
          python scripts/publier.py --precedent "$ADRESSE_SITE/dernier" --adresse "$ADRESSE_SITE"
          dossier=$(ls -d sorties/*_publication | tail -n 1)
          python -c "import json,sys; r=json.load(open(sys.argv[1]+'/resultat.json')); print('nouvelle_version=' + str(r['nouvelle_version']).lower()); print('version=' + r['version'])" "$dossier" >> "$GITHUB_OUTPUT"
          echo "dossier=$dossier" >> "$GITHUB_OUTPUT"

      - name: Préparer le site pour GitHub Pages
        uses: actions/upload-pages-artifact@v5
        with:
          path: ${{ steps.publier.outputs.dossier }}/site

      # Une version datée seulement quand les données ont vraiment changé (voir docs/publication.md).
      - name: Créer la version datée dans les Releases
        if: steps.publier.outputs.nouvelle_version == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v="${{ steps.publier.outputs.version }}"
          gh release create "donnees-$v" ${{ steps.publier.outputs.dossier }}/release/* \
            --title "Données du $v" \
            --notes "Version des données publiée le $v. Ce qui a changé : voir journal.json. Sources : Assemblée nationale et DILA (Légifrance), Licence Ouverte 2.0. Clés de lecture dans chaque fichier."

      - name: Conserver les sorties (90 jours)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: sorties-${{ github.run_number }}
          path: sorties/
          retention-days: 90
          if-no-files-found: warn

  # Mise en ligne sur GitHub Pages, seulement si tout ce qui précède a réussi.
  publier:
    needs: briques
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    steps:
      - name: Mettre en ligne
        id: deploiement
        uses: actions/deploy-pages@v5
